<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leggo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #cdeeff;
    --card: #ffffff;
    --ink: #1b2a4a;
    --dot: #9fc9e6;
    --dot-on: #ffb703;
    --b1: #ef476f;
    --b2: #1f9d6b;
    --b3: #6d5bf0;
    --b4: #d97706;
    --ok: #1f9d6b;
    --okbg: #c9f2dc;
    --sky1: #9bd8ff;
    --sky2: #e6f6ff;
    --font: "Fredoka", "Trebuchet MS", system-ui, -apple-system, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
      --okbg: #1d5a43; --sky1: #21406e; --sky2: #32588f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
    --okbg: #1d5a43; --sky1: #21406e; --sky2: #32588f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden;
  }
  #app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 14px 18px 22px; box-sizing: border-box;
  }
  button { font-family: var(--font); cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  /* ---------- home ---------- */
  #home { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .homein { margin: auto 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 8px; }
  #home h1 { margin: 0; text-align: center; font-size: 52px; letter-spacing: .04em; line-height: 1; }
  #home h1 span:nth-child(3n+1) { color: var(--b1); }
  #home h1 span:nth-child(3n+2) { color: var(--b2); }
  #home h1 span:nth-child(3n+3) { color: var(--b3); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mt {
    appearance: none; border: 0; border-radius: 26px; color: #fff;
    padding: 12px 6px 10px; min-height: 100px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
  }
  .mt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
  .mt.c1 { background: var(--b1); } .mt.c2 { background: var(--b3); }
  .mt.c3 { background: var(--b2); } .mt.c4 { background: var(--b4); }
  .mt.wide { grid-column: 1 / -1; min-height: 84px; }
  .mt .ti { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  .mt .e { font-family: var(--emoji); font-size: 36px; letter-spacing: 0; }
  .mt .ar { font-size: 22px; opacity: .85; letter-spacing: 0; }
  .mt .tl { font-size: 14px; font-weight: 500; opacity: .95; letter-spacing: 0; }
  .settings { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 2px; }
  .slabel { font-weight: 700; font-size: 18px; opacity: .75; }
  .seg { display: flex; gap: 8px; }
  .lt {
    appearance: none; border: 0; background: var(--card); color: var(--ink);
    font-weight: 700; font-size: 22px; min-width: 56px; height: 46px; padding: 0 14px;
    border-radius: 23px; box-shadow: 0 3px 0 rgba(27, 42, 74, .15);
  }
  .lt.on { background: var(--ink); color: var(--card); }

  /* ---------- game ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; }
  .back {
    appearance: none; border: 0; background: var(--card); color: var(--ink);
    width: 42px; height: 42px; border-radius: 50%; font-size: 22px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(27, 42, 74, .15); flex: none;
  }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); transition: background .25s, transform .25s; }
  .dot.now { transform: scale(1.35); background: var(--ink); }
  .dot.star { background: var(--dot-on); }
  .dot.done { background: var(--ok); }
  .stat { font-size: 24px; font-weight: 700; white-space: nowrap; min-width: 62px; text-align: right; }

  .pic {
    flex: 1 1 auto; min-height: 0;
    margin: 14px 0 12px;
    background: var(--card); border-radius: 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(27, 42, 74, .12);
  }
  #emoji { font-size: min(46vw, 24vh, 190px); line-height: 1; font-family: var(--emoji); }
  #emoji:empty { display: none; }
  #emoji.hop { animation: hop .6s ease-out; }
  @keyframes hop { 0% { transform: translateY(0) scale(.6) } 35% { transform: translateY(-22px) scale(1.08) } 70% { transform: translateY(0) scale(.97) } 100% { transform: none } }

  #word {
    min-height: 64px; margin-top: 6px; display: flex; gap: 6px; align-items: center;
    font-size: 54px; font-weight: 700; letter-spacing: .04em;
  }
  #word span { display: inline-block; }
  #word .blank { min-width: .75em; height: .9em; border-bottom: 6px solid var(--ink); margin: 0 2px; }
  #word.pop span { animation: letter .5s ease-out both; }
  @keyframes letter { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  .wordmode #word { font-size: min(20vw, 96px); letter-spacing: .1em; }
  .wordmode.solved #word { font-size: min(15vw, 64px); }

  .newtag {
    display: none; margin-top: 2px; padding: 4px 16px; border-radius: 999px;
    background: var(--dot-on); color: #3a2a00; font-weight: 700; font-size: 18px;
  }
  .newtag.on { display: block; animation: hop .6s ease-out; }

  /* what is visible in each mode */
  #game .choices, #game .build, #game .sky, #game .board { display: none; }
  #game[data-m="pic"] .choices, #game[data-m="word"] .choices, #game[data-m="missing"] .choices { display: grid; }
  #game[data-m="build"] .build { display: flex; }
  #game[data-m="build"] #word { display: none; }
  #game[data-m="balloons"] .sky { display: block; }
  #game[data-m="balloons"] .pic { flex: 0 0 auto; padding: 10px 0; }
  #game[data-m="balloons"] #emoji { font-size: min(28vw, 14vh, 110px); }
  #game[data-m="balloons"] #word { min-height: 0; font-size: 36px; margin: 0; }
  #game[data-m="memory"] .board { display: grid; }
  #game[data-m="memory"] .pic { display: none; }

  .choices { gap: 12px; }
  .choice {
    appearance: none; border: 0; color: #fff;
    font-weight: 700; font-size: 42px; letter-spacing: .14em; text-indent: .14em;
    height: 82px; border-radius: 26px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
    transition: transform .1s, box-shadow .1s, opacity .3s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
  .choice:nth-child(1) { background: var(--b1); }
  .choice:nth-child(2) { background: var(--b2); }
  .choice:nth-child(3) { background: var(--b3); }
  .choices.pics { grid-template-columns: repeat(3, 1fr); }
  .choices.pics .choice {
    height: auto; aspect-ratio: 1 / 1; max-height: 150px;
    font-family: var(--emoji); font-size: min(17vw, 76px); letter-spacing: 0; text-indent: 0;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .choices.letters .choice { font-family: var(--font); font-weight: 700; font-size: min(18vw, 72px); }
  .choice.wrong { animation: wob .4s; opacity: .4; }
  .choice.hint { animation: glow .8s ease-in-out infinite; }
  .choice.right { background: var(--ok) !important; }
  .choice.fade { opacity: .25; pointer-events: none; }
  @keyframes wob { 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }
  @keyframes glow { 50% { transform: scale(1.06) } }

  /* componi la parola */
  .build { flex-direction: column; align-items: center; gap: 18px; padding: 2px 0 4px; }
  .slots { display: flex; gap: 8px; justify-content: center; }
  .slot {
    width: 60px; height: 72px; border-radius: 18px; background: var(--card);
    border-bottom: 6px solid var(--dot); box-sizing: border-box;
    font-size: 46px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .slot.cur { border-bottom-color: var(--ink); }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .lk {
    appearance: none; border: 0; color: #fff; font-weight: 700; font-size: 42px;
    width: 68px; height: 78px; border-radius: 20px; box-shadow: 0 5px 0 rgba(0, 0, 0, .22);
    transition: opacity .25s;
  }
  .lk:nth-child(3n+1) { background: var(--b1); }
  .lk:nth-child(3n+2) { background: var(--b2); }
  .lk:nth-child(3n+3) { background: var(--b3); }
  .lk:active { transform: translateY(3px); }
  .tiles.five { gap: 7px; }
  .tiles.five .lk { width: 58px; }
  .slots.five .slot { width: 54px; }
  .lk.used { opacity: .12; pointer-events: none; }
  .lk.wrong { animation: wob .4s; }
  .lk.hint { animation: glow .8s ease-in-out infinite; }

  /* palloncini */
  .sky {
    position: relative; flex: 1; min-height: 0; margin: 0 0 4px; border-radius: 30px; overflow: hidden;
    background: linear-gradient(180deg, var(--sky1), var(--sky2)); box-shadow: 0 6px 0 rgba(27, 42, 74, .12);
  }
  .balloon {
    appearance: none; border: 0; background: none; padding: 0;
    position: absolute; bottom: -160px; width: 30%; max-width: 130px;
    animation: rise var(--dur) linear var(--delay) both;
  }
  .bl-in {
    position: relative; display: flex; align-items: center; justify-content: center;
    aspect-ratio: .82; border-radius: 50% 50% 46% 46%; color: #fff; font-weight: 700;
    font-size: min(7.2vw, 30px); letter-spacing: .08em; text-indent: .08em;
    box-shadow: inset -8px -10px 0 rgba(0, 0, 0, .14);
    animation: sway 2.2s ease-in-out infinite alternate;
  }
  .bl-in::after {
    content: ""; position: absolute; left: 50%; top: 99%; width: 2px; height: 46px;
    background: rgba(27, 42, 74, .45); transform: translateX(-50%);
  }
  .bl-in.long { font-size: min(5.8vw, 24px); letter-spacing: .04em; text-indent: .04em; }
  .balloon.c0 .bl-in { background: var(--b1); }
  .balloon.c1 .bl-in { background: var(--b2); }
  .balloon.c2 .bl-in { background: var(--b3); }
  @keyframes sway { from { transform: translateX(-8px) rotate(-3deg) } to { transform: translateX(8px) rotate(3deg) } }
  @keyframes rise { to { transform: translateY(calc(var(--travel) * -1)); } }
  .balloon.popped .bl-in { animation: none; transform: scale(1.6); opacity: 0; transition: transform .25s, opacity .25s; }
  .balloon.gone { opacity: 0; transition: opacity .3s; pointer-events: none; }
  .balloon.wrong .bl-in { animation: wob .4s forwards; opacity: .4; }
  .balloon.hint .bl-in { box-shadow: inset -8px -10px 0 rgba(0, 0, 0, .14), 0 0 0 5px #fff, 0 0 20px 8px #ffd54a; }

  /* memory */
  .board {
    flex: 1; min-height: 0; grid-template-columns: repeat(3, 1fr); gap: 10px;
    align-content: center; margin-top: 14px; overflow-y: auto;
  }
  .card {
    appearance: none; border: 0; border-radius: 20px; aspect-ratio: 1 / 1; padding: 0;
    background: var(--b3); color: #fff; font-family: var(--font); font-size: 44px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .22);
  }
  .card.up { background: var(--card); color: var(--ink); font-family: var(--emoji); }
  .card.up.isword { font-family: var(--font); font-size: min(7.2vw, 28px); letter-spacing: .08em; text-indent: .08em; }
  .card.up.isword.long { font-size: min(5.8vw, 23px); letter-spacing: .03em; text-indent: .03em; }
  .card.ok { background: var(--okbg); color: var(--ink); box-shadow: none; transform: translateY(3px); }

  /* album */
  #album .top { margin-bottom: 8px; }
  #album .atitle { font-size: 30px; font-weight: 700; letter-spacing: .08em; }
  .agrid {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; padding: 4px 2px 12px;
  }
  .st {
    background: var(--card); border-radius: 18px; aspect-ratio: 1 / 1.08;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 4px 0 rgba(27, 42, 74, .12);
  }
  .st .se { font-size: 34px; font-family: var(--emoji); line-height: 1.1; }
  .st .sw { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .st.lock .se { filter: grayscale(1) brightness(.25); opacity: .3; }
  .st.lock .sw { opacity: .4; }
  .st .se.hop { animation: hop .6s ease-out; }

  /* end */
  #end { align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #end h1 { margin: 0; font-size: 72px; line-height: 1; }
  #end .big { font-size: 64px; letter-spacing: .06em; }
  #end .newn { font-size: 26px; font-weight: 700; min-height: 32px; }
  .endbtns { display: flex; gap: 22px; align-items: center; margin-top: 18px; }
  #again {
    appearance: none; border: 0; width: 128px; height: 128px; border-radius: 50%;
    background: var(--b2); color: #fff; font-size: 56px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .22);
  }
  #again:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0, 0, 0, .22); }
  #toHome { width: 64px; height: 64px; font-size: 30px; }

  @media (max-height: 700px) {
    .choice { height: 66px; font-size: 34px; }
    #word { font-size: 44px; min-height: 52px; }
    .mt { min-height: 84px; }
    .lk { height: 66px; width: 60px; font-size: 36px; }
    .slot { height: 62px; font-size: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *:not(.balloon) { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="screen on" id="home">
    <div class="homein">
      <h1 aria-label="Leggo"><span>L</span><span>E</span><span>G</span><span>G</span><span>O</span><span>!</span></h1>
      <div class="grid">
        <button class="mt c1" data-mode="pic" aria-label="Guarda il disegno, scegli la parola">
          <span class="ti"><span class="e">🍎</span><span class="ar">→</span><span>MELA</span></span>
          <span class="tl">Scegli la parola</span>
        </button>
        <button class="mt c2" data-mode="word" aria-label="Leggi la parola, scegli il disegno">
          <span class="ti"><span>MELA</span><span class="ar">→</span><span class="e">🍎</span></span>
          <span class="tl">Scegli il disegno</span>
        </button>
        <button class="mt c3" data-mode="build" aria-label="Componi la parola con le lettere">
          <span class="ti"><span class="e">🧩</span></span>
          <span class="tl">Componi la parola</span>
        </button>
        <button class="mt c4" data-mode="missing" aria-label="Trova la lettera mancante">
          <span class="ti">ME_A</span>
          <span class="tl">Lettera mancante</span>
        </button>
        <button class="mt c2" data-mode="memory" aria-label="Memory">
          <span class="ti"><span class="e">🃏</span></span>
          <span class="tl">Memory</span>
        </button>
        <button class="mt c1" data-mode="balloons" aria-label="Palloncini">
          <span class="ti"><span class="e">🎈</span></span>
          <span class="tl">Palloncini</span>
        </button>
        <button class="mt c3 wide" data-mode="album" aria-label="Album delle figurine">
          <span class="ti"><span class="e">📒</span><span id="albumCount">0/0</span></span>
          <span class="tl">Album delle figurine</span>
        </button>
      </div>
      <div class="settings">
        <span class="slabel">Lettere</span>
        <div class="seg" role="group" aria-label="Numero di lettere">
          <button class="lt" data-n="3" type="button">3</button>
          <button class="lt" data-n="4" type="button">4</button>
          <button class="lt" data-n="all" type="button">3-4</button>
          <button class="lt" data-n="5" type="button">5</button>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="game" data-m="pic">
    <div class="top">
      <button class="back" id="back" aria-label="Torna all'inizio">✕</button>
      <div class="dots" id="dots"></div>
      <div class="stat" id="stat">⭐ 0</div>
    </div>
    <div class="pic" id="pic">
      <div id="emoji" aria-hidden="true"></div>
      <div id="word" aria-live="polite"></div>
      <div class="newtag" id="newtag">🎉 NUOVA!</div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="build" id="build">
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="sky" id="sky"></div>
    <div class="board" id="board"></div>
  </div>

  <div class="screen" id="album">
    <div class="top">
      <button class="back" id="albumBack" aria-label="Torna all'inizio">✕</button>
      <div class="atitle">ALBUM</div>
      <div class="stat" id="albumStat"></div>
    </div>
    <div class="agrid" id="agrid"></div>
  </div>

  <div class="screen" id="end">
    <h1>BRAVO!</h1>
    <div class="big" id="endStars"></div>
    <div class="newn" id="endNew"></div>
    <div class="endbtns">
      <button class="back" id="toHome" aria-label="Cambia gioco">✕</button>
      <button id="again" aria-label="Gioca ancora">▶</button>
    </div>
  </div>
</div>

<script>
(function () {
  var WORDS = [
    ['SOLE', '☀️'], ['LUNA', '🌙'], ['CASA', '🏠'], ['CANE', '🐶'], ['MELA', '🍎'],
    ['PANE', '🍞'], ['UOVO', '🥚'], ['NASO', '👃'], ['MANO', '✋'], ['RANA', '🐸'],
    ['MARE', '🌊'], ['AUTO', '🚗'], ['NAVE', '🚢'], ['LUPO', '🐺'], ['DITO', '👆'],
    ['UVA', '🍇'], ['ROSA', '🌹'], ['NEVE', '❄️'], ['OSSO', '🦴'], ['DADO', '🎲'],
    ['PERA', '🍐'], ['MOTO', '🏍️'], ['OCA', '🪿'], ['SCI', '⛷️'],
    ['APE', '🐝'], ['SALE', '🧂'], ['TOPO', '🐭'], ['TORO', '🐂'],
    ['FOCA', '🦭'], ['FATA', '🧚'], ['VASO', '🏺'], ['VELA', '⛵'], ['MAGO', '🧙'],
    ['ORSO', '🐻'], ['RISO', '🍚'], ['LAMA', '🦙'], ['KIWI', '🥝'], ['CIAO', '👋'],
    ['LUCE', '💡'], ['NUBE', '☁️'], ['TAXI', '🚕'], ['ERBA', '🌿'], ['MURO', '🧱'],
    ['DONO', '🎁'], ['ELMO', '🪖'], ['ARCO', '🏹'], ['BACO', '🐛'], ['PINO', '🌲'],
    ['FILM', '🎬'], ['VITE', '🔩'],
    ['BUS', '🚌'], ['UFO', '🛸'], ['ORA', '🕒'], ['TIR', '🚛'], ['SAX', '🎷'], ['AGO', '🪡'],
    ['GATTO', '🐱'], ['TRENO', '🚂'], ['PESCE', '🐟'], ['FIORE', '🌸'], ['LIBRO', '📖'],
    ['PALLA', '⚽'], ['TORTA', '🎂'], ['MUCCA', '🐮'], ['PIZZA', '🍕'], ['FUNGO', '🍄'],
    ['LEONE', '🦁'], ['TIGRE', '🐯'], ['ZEBRA', '🦓'], ['PANDA', '🐼'], ['KOALA', '🐨'],
    ['CUORE', '❤️'], ['FUOCO', '🔥'], ['BARCA', '🛶'], ['POLPO', '🐙'], ['CAPRA', '🐐'],
    ['LATTE', '🥛'], ['ROBOT', '🤖'], ['TENDA', '⛺'], ['LETTO', '🛏️'], ['DENTE', '🦷'],
    ['BOCCA', '👄'], ['ISOLA', '🏝️'], ['PORTA', '🚪'], ['SEDIA', '🪑'], ['MONDO', '🌍']
  ];
  var ROUND = 10, PAIRS = 6;
  var COLS = ['var(--b1)', 'var(--b2)', 'var(--b3)', '#f08a00'];
  var $ = function (id) { return document.getElementById(id); };
  var screens = { home: $('home'), game: $('game'), album: $('album'), end: $('end') };
  var gameEl = $('game'), dotsEl = $('dots'), statEl = $('stat'), emojiEl = $('emoji'), wordEl = $('word'),
      newtagEl = $('newtag'), choicesEl = $('choices'), picEl = $('pic'), slotsEl = $('slots'),
      tilesEl = $('tiles'), skyEl = $('sky'), boardEl = $('board');

  var mode = 'pic';
  var queue = [], idx = 0, stars = 0, newCount = 0, mistakes = 0, locked = false, timer = null;
  var correctKey = '', bi = 0;
  var mem = null;

  /* ---------- salvataggi sul telefono ---------- */
  var prog = {};
  try { prog = JSON.parse(localStorage.getItem('leggo-prog') || '{}') || {}; } catch (e) { prog = {}; }
  function saveProg() { try { localStorage.setItem('leggo-prog', JSON.stringify(prog)); } catch (e) {} }

  // registra una risposta giusta; restituisce true se la figurina è nuova
  function record(word, firstTry) {
    var p = prog[word] || (prog[word] = { b: 0, n: 0, u: 0 });
    p.n++;
    p.b = firstTry ? Math.min(4, p.b + 1) : 0;
    var isNew = !p.u;
    p.u = 1;
    saveProg();
    return isNew;
  }
  function unlockedCount() {
    return WORDS.filter(function (w) { return prog[w[0]] && prog[w[0]].u; }).length;
  }

  var letters = 'all';
  try {
    var saved = localStorage.getItem('leggo-lettere');
    if (saved === '3' || saved === '4' || saved === '5' || saved === 'all') letters = saved;
  } catch (e) {}

  function pool() {
    return WORDS.filter(function (w) { return letters === 'all' ? w[0].length <= 4 : w[0].length === parseInt(letters, 10); });
  }
  function paintLetters() {
    Array.prototype.forEach.call(document.querySelectorAll('.lt'), function (b) {
      var on = b.dataset.n === letters;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lt'), function (b) {
    b.addEventListener('click', function () {
      letters = b.dataset.n;
      try { localStorage.setItem('leggo-lettere', letters); } catch (e) {}
      paintLetters();
    });
  });
  paintLetters();

  /* ---------- utilità ---------- */
  function go(name) {
    for (var k in screens) screens[k].classList.toggle('on', k === name);
    if (name === 'home') paintHome();
  }
  function paintHome() { $('albumCount').textContent = unlockedCount() + '/' + WORDS.length; }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ripasso intelligente: le parole sbagliate o mai viste escono più spesso
  function weight(w) {
    var p = prog[w[0]];
    if (!p || !p.n) return 6;
    return [9, 5, 3, 2, 1][p.b] || 1;
  }
  function weightedSample(arr, n) {
    var src = arr.slice(), out = [];
    while (out.length < n && src.length) {
      var total = 0, i;
      for (i = 0; i < src.length; i++) total += weight(src[i]);
      var r = Math.random() * total;
      for (i = 0; i < src.length - 1; i++) { r -= weight(src[i]); if (r <= 0) break; }
      out.push(src.splice(i, 1)[0]);
    }
    return out;
  }

  // risposte sbagliate che iniziano con la stessa lettera della parola giusta
  function pickChoices(target) {
    var letter = target.word[0];
    var same = shuffle(pool().filter(function (w) { return w[0] !== target.word && w[0][0] === letter; }));
    var rest = shuffle(pool().filter(function (w) { return w[0][0] !== letter; }));
    var chosen = same.slice(0, 2);
    while (chosen.length < 2) chosen.push(rest.shift());
    return shuffle([[target.word, target.pic]].concat(chosen));
  }

  var ALPHA = (function () {
    var s = {};
    WORDS.forEach(function (w) { w[0].split('').forEach(function (c) { s[c] = 1; }); });
    return Object.keys(s);
  })();
  function letterChoices(c) {
    var o = shuffle(ALPHA.filter(function (x) { return x !== c; })).slice(0, 2);
    return shuffle([c].concat(o));
  }

  function buildDots(n) {
    dotsEl.innerHTML = '';
    for (var i = 0; i < n; i++) { var d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); }
  }
  function paintDots() {
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      var q = queue[i];
      dots[i].className = 'dot' + (q.done ? (q.star ? ' star' : ' done') : (i === idx ? ' now' : ''));
    }
  }
  function updateStat() {
    statEl.textContent = mode === 'memory' ? '👆 ' + mem.moves : '⭐ ' + stars;
  }

  function setWord(text, colored) {
    wordEl.innerHTML = '';
    wordEl.classList.toggle('pop', !!colored);
    text.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.textContent = ch;
      if (colored) { s.style.color = COLS[i % COLS.length]; s.style.animationDelay = (i * 0.09) + 's'; }
      wordEl.appendChild(s);
    });
  }
  function setWordBlank(word, at) {
    wordEl.innerHTML = '';
    wordEl.classList.remove('pop');
    word.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      if (i === at) { s.className = 'blank'; s.innerHTML = '&nbsp;'; } else s.textContent = ch;
      wordEl.appendChild(s);
    });
  }

  /* ---------- avvio ---------- */
  function start(m) {
    if (m) mode = m;
    clearTimeout(timer);
    stars = 0; newCount = 0; idx = 0;
    gameEl.dataset.m = mode;
    if (mode === 'memory') { startMemory(); return; }
    queue = weightedSample(pool(), ROUND).map(function (w) {
      return { word: w[0], pic: w[1], star: false, done: false };
    });
    buildDots(queue.length);
    updateStat();
    go('game');
    show();
  }

  function show() {
    var w = queue[idx];
    mistakes = 0; locked = false;
    paintDots();
    picEl.classList.toggle('wordmode', mode === 'word');
    picEl.classList.remove('solved');
    emojiEl.classList.remove('hop');
    newtagEl.classList.remove('on');
    wordEl.innerHTML = '';
    choicesEl.innerHTML = '';
    slotsEl.innerHTML = '';
    tilesEl.innerHTML = '';
    skyEl.innerHTML = '';

    if (mode === 'word') emojiEl.textContent = ''; else emojiEl.textContent = w.pic;

    if (mode === 'pic' || mode === 'word' || mode === 'missing') showChoices(w);
    else if (mode === 'build') showBuild(w);
    else if (mode === 'balloons') showBalloons(w);
  }

  /* ---------- scegli parola / disegno / lettera mancante ---------- */
  function showChoices(w) {
    var opts;
    choicesEl.className = 'choices' + (mode === 'word' ? ' pics' : '') + (mode === 'missing' ? ' pics letters' : '');
    if (mode === 'missing') {
      bi = Math.floor(Math.random() * w.word.length);
      correctKey = w.word[bi];
      setWordBlank(w.word, bi);
      opts = letterChoices(correctKey).map(function (l) { return [l, l]; });
    } else {
      correctKey = w.word;
      if (mode === 'word') setWord(w.word, false);
      opts = pickChoices(w);
    }
    opts.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'choice'; b.type = 'button';
      b.dataset.k = c[0];
      b.textContent = (mode === 'word') ? c[1] : c[0];
      if (mode === 'word') b.setAttribute('aria-label', 'Disegno');
      b.addEventListener('click', function () { answer(b); });
      choicesEl.appendChild(b);
    });
  }

  function answer(btn) {
    if (locked) return;
    var w = queue[idx];
    if (btn.dataset.k !== correctKey) {
      mistakes++;
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      btn.disabled = true;
      if (mistakes >= 2) {
        Array.prototype.forEach.call(choicesEl.children, function (b) {
          if (b.dataset.k === correctKey) b.classList.add('hint');
        });
      }
      return;
    }
    Array.prototype.forEach.call(choicesEl.children, function (b) {
      b.classList.remove('hint');
      if (b === btn) b.classList.add('right'); else b.classList.add('fade');
    });
    setWord(w.word, true);
    solved(w);
  }

  // comune a tutti i giochi a round: risposta giusta
  function solved(w) {
    locked = true;
    w.star = (mistakes === 0);
    w.done = true;
    if (w.star) stars++;
    if (record(w.word, w.star)) { newCount++; newtagEl.classList.add('on'); }
    updateStat();
    picEl.classList.add('solved');
    emojiEl.textContent = w.pic;
    void emojiEl.offsetWidth;
    emojiEl.classList.add('hop');
    paintDots();
    timer = setTimeout(next, 1900);
  }

  function next() {
    idx++;
    if (idx >= queue.length) return finish();
    show();
  }

  /* ---------- componi la parola ---------- */
  function showBuild(w) {
    var L = w.word.split('');
    bi = 0;
    tilesEl.classList.toggle('five', L.length > 4);
    slotsEl.classList.toggle('five', L.length > 4);
    L.forEach(function () { var s = document.createElement('div'); s.className = 'slot'; slotsEl.appendChild(s); });
    var order = shuffle(L), tries = 0;
    while (tries++ < 10 && order.join('') === L.join('') && L.length > 1) order = shuffle(L);
    order.forEach(function (ch) {
      var b = document.createElement('button');
      b.className = 'lk'; b.type = 'button'; b.textContent = ch; b.dataset.l = ch;
      b.addEventListener('click', function () { tapLetter(b); });
      tilesEl.appendChild(b);
    });
    markCur();
  }
  function markCur() {
    Array.prototype.forEach.call(slotsEl.children, function (s, i) { s.classList.toggle('cur', i === bi); });
  }
  function tapLetter(b) {
    if (locked || b.classList.contains('used')) return;
    var w = queue[idx];
    if (b.dataset.l === w.word[bi]) {
      var slot = slotsEl.children[bi];
      slot.textContent = b.dataset.l;
      slot.style.color = COLS[bi % COLS.length];
      b.classList.add('used');
      Array.prototype.forEach.call(tilesEl.children, function (t) { t.classList.remove('hint'); });
      bi++;
      if (bi >= w.word.length) { markCur(); solved(w); } else markCur();
    } else {
      mistakes++;
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      if (mistakes >= 2) {
        var exp = w.word[bi];
        var hit = Array.prototype.filter.call(tilesEl.children, function (t) {
          return !t.classList.contains('used') && t.dataset.l === exp;
        })[0];
        if (hit) hit.classList.add('hint');
      }
    }
  }

  /* ---------- palloncini ---------- */
  function showBalloons(w) {
    skyEl.innerHTML = '';
    correctKey = w.word;
    var travel = Math.max(300, skyEl.clientHeight + 170);
    var dur = Math.max(7, 13 - idx * 0.5);
    var lanes = shuffle([3, 35, 67]);
    pickChoices(w).forEach(function (o, i) {
      var b = document.createElement('button');
      b.className = 'balloon c' + (i % 3); b.type = 'button';
      b.dataset.k = o[0];
      b.style.left = lanes[i] + '%';
      b.style.setProperty('--travel', travel + 'px');
      b.style.setProperty('--dur', dur + 's');
      b.style.setProperty('--delay', (i * 0.7) + 's');
      var inner = document.createElement('span');
      inner.className = 'bl-in' + (o[0].length > 4 ? ' long' : ''); inner.textContent = o[0];
      b.appendChild(inner);
      b.addEventListener('click', function () { popBalloon(b); });
      b.addEventListener('animationend', function (e) {
        if (e.target !== b || locked) return;
        if (b.dataset.k === correctKey) { mistakes++; showBalloons(queue[idx]); } // il palloncino giusto è volato via: si riparte
        else b.style.display = 'none';
      });
      skyEl.appendChild(b);
    });
  }
  function popBalloon(b) {
    if (locked) return;
    var w = queue[idx];
    if (b.dataset.k !== w.word) {
      mistakes++;
      b.classList.add('wrong'); b.disabled = true;
      if (mistakes >= 2) {
        Array.prototype.forEach.call(skyEl.children, function (x) {
          if (x.dataset.k === w.word) x.classList.add('hint');
        });
      }
      return;
    }
    var tr = getComputedStyle(b).transform;
    b.style.animation = 'none';
    b.style.transform = tr;
    b.classList.remove('hint');
    b.classList.add('popped');
    Array.prototype.forEach.call(skyEl.children, function (x) { if (x !== b) x.classList.add('gone'); });
    setWord(w.word, true);
    solved(w);
  }

  /* ---------- memory ---------- */
  function startMemory() {
    var ws = weightedSample(pool(), PAIRS);
    var cards = [];
    ws.forEach(function (w) {
      cards.push({ word: w[0], pic: w[1], type: 'pic' });
      cards.push({ word: w[0], pic: w[1], type: 'word' });
    });
    mem = { cards: shuffle(cards), first: null, busy: false, moves: 0, matched: 0, pairs: ws.length, missed: {} };
    buildDots(mem.pairs);
    boardEl.innerHTML = '';
    mem.cards.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'card'; b.type = 'button'; b.textContent = '?';
      b.setAttribute('aria-label', 'Carta');
      b.addEventListener('click', function () { flip(b, c); });
      c.el = b;
    });
    mem.cards.forEach(function (c) { boardEl.appendChild(c.el); });
    updateStat();
    paintMemDots();
    go('game');
  }
  function paintMemDots() {
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) dots[i].className = 'dot' + (i < mem.matched ? ' done' : '');
  }
  function faceUp(c) {
    c.up = true;
    c.el.classList.add('up');
    c.el.classList.toggle('isword', c.type === 'word');
    c.el.classList.toggle('long', c.type === 'word' && c.word.length > 4);
    c.el.textContent = c.type === 'pic' ? c.pic : c.word;
  }
  function faceDown(c) {
    c.up = false;
    c.el.classList.remove('up', 'isword', 'long');
    c.el.textContent = '?';
  }
  function flip(b, c) {
    if (mem.busy || c.up || c.done) return;
    faceUp(c);
    if (!mem.first) { mem.first = c; return; }
    var f = mem.first; mem.first = null;
    mem.moves++;
    updateStat();
    if (f.word === c.word) {
      f.done = c.done = true;
      f.el.classList.add('ok'); c.el.classList.add('ok');
      mem.matched++;
      if (record(c.word, !mem.missed[c.word])) newCount++;
      paintMemDots();
      if (mem.matched === mem.pairs) {
        mem.busy = true;
        stars = mem.moves <= mem.pairs + 2 ? 3 : (mem.moves <= mem.pairs + 6 ? 2 : 1);
        timer = setTimeout(finish, 1100);
      }
    } else {
      mem.missed[f.word] = 1; mem.missed[c.word] = 1;
      mem.busy = true;
      timer = setTimeout(function () { faceDown(f); faceDown(c); mem.busy = false; }, 900);
    }
  }

  /* ---------- fine partita ---------- */
  function finish() {
    $('endStars').textContent = mode === 'memory' ? new Array(stars + 1).join('⭐') : '⭐ ' + stars;
    $('endNew').textContent = newCount > 0 ? '🎉 +' + newCount + (newCount === 1 ? ' figurina' : ' figurine') : '';
    go('end');
  }

  /* ---------- album ---------- */
  function openAlbum() {
    var grid = $('agrid');
    grid.innerHTML = '';
    var sorted = WORDS.slice().sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
    sorted.forEach(function (w) {
      var p = prog[w[0]];
      var open = !!(p && p.u);
      var d = document.createElement('div');
      d.className = 'st' + (open ? '' : ' lock');
      var e = document.createElement('div'); e.className = 'se'; e.textContent = w[1];
      var t = document.createElement('div'); t.className = 'sw'; t.textContent = open ? w[0] : '?';
      d.appendChild(e); d.appendChild(t);
      if (open) d.addEventListener('click', function () {
        e.classList.remove('hop'); void e.offsetWidth; e.classList.add('hop');
      });
      grid.appendChild(d);
    });
    $('albumStat').textContent = unlockedCount() + '/' + WORDS.length;
    go('album');
  }

  /* ---------- pulsanti ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.mt'), function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.mode === 'album') openAlbum(); else start(b.dataset.mode);
    });
  });
  $('again').addEventListener('click', function () { start(); });
  $('back').addEventListener('click', function () { clearTimeout(timer); skyEl.innerHTML = ''; go('home'); });
  $('albumBack').addEventListener('click', function () { go('home'); });
  $('toHome').addEventListener('click', function () { go('home'); });

  paintHome();
})();
</script>
</body>
</html>
