<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leggo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #cdeeff;
    --card: #ffffff;
    --ink: #1b2a4a;
    --dot: #9fc9e6;
    --dot-on: #ffb703;
    --b1: #ef476f;
    --b2: #1f9d6b;
    --b3: #6d5bf0;
    --ok: #1f9d6b;
    --font: "Fredoka", "Trebuchet MS", system-ui, -apple-system, sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden;
  }
  #app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 14px 18px 22px; box-sizing: border-box;
  }
  button { font-family: var(--font); cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  /* ---------- home ---------- */
  #home { align-items: stretch; justify-content: center; gap: 20px; }
  #home h1 { margin: 0 0 10px; text-align: center; font-size: 64px; letter-spacing: .04em; line-height: 1; }
  #home h1 span:nth-child(3n+1) { color: var(--b1); }
  #home h1 span:nth-child(3n+2) { color: var(--b2); }
  #home h1 span:nth-child(3n+3) { color: var(--b3); }
  .mode {
    appearance: none; border: 0; border-radius: 30px; color: #fff;
    height: 120px; display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 44px; font-weight: 700; letter-spacing: .1em;
    box-shadow: 0 7px 0 rgba(0, 0, 0, .22);
  }
  .mode:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
  .mode .e { font-family: var(--emoji); font-size: 54px; letter-spacing: 0; }
  .mode .arrow { font-size: 34px; opacity: .85; letter-spacing: 0; }
  #modePic { background: var(--b3); }
  #modeWord { background: var(--b1); }

  /* ---------- game ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
  .back {
    appearance: none; border: 0; background: var(--card); color: var(--ink);
    width: 42px; height: 42px; border-radius: 50%; font-size: 22px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(27, 42, 74, .15); flex: none;
  }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); transition: background .25s, transform .25s; }
  .dot.now { transform: scale(1.35); background: var(--ink); }
  .dot.star { background: var(--dot-on); }
  .dot.done { background: var(--ok); }
  .stars { font-size: 24px; font-weight: 700; white-space: nowrap; }

  .pic {
    flex: 1 1 auto; min-height: 0;
    margin: 14px 0 12px;
    background: var(--card); border-radius: 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(27, 42, 74, .12);
  }
  #emoji { font-size: min(46vw, 24vh, 190px); line-height: 1; font-family: var(--emoji); }
  #emoji:empty { display: none; }
  #emoji.hop { animation: hop .6s ease-out; }
  @keyframes hop { 0% { transform: translateY(0) scale(.6) } 35% { transform: translateY(-22px) scale(1.08) } 70% { transform: translateY(0) scale(.97) } 100% { transform: none } }

  #word {
    min-height: 64px; margin-top: 6px; display: flex; gap: 6px; align-items: center;
    font-size: 54px; font-weight: 700; letter-spacing: .04em;
  }
  #word span { display: inline-block; }
  #word.pop span { animation: letter .5s ease-out both; }
  @keyframes letter { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  .wordmode #word { font-size: min(20vw, 96px); letter-spacing: .1em; }
  .wordmode.solved #word { font-size: min(15vw, 64px); }

  .choices { display: grid; gap: 12px; }
  .choice {
    appearance: none; border: 0; color: #fff;
    font-weight: 700; font-size: 42px; letter-spacing: .14em; text-indent: .14em;
    height: 82px; border-radius: 26px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
    transition: transform .1s, box-shadow .1s, opacity .3s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
  .choice:nth-child(1) { background: var(--b1); }
  .choice:nth-child(2) { background: var(--b2); }
  .choice:nth-child(3) { background: var(--b3); }
  .choices.pics { grid-template-columns: repeat(3, 1fr); }
  .choices.pics .choice {
    height: auto; aspect-ratio: 1 / 1; max-height: 150px;
    font-family: var(--emoji); font-size: min(17vw, 76px); letter-spacing: 0; text-indent: 0;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .choice.wrong { animation: wob .4s; opacity: .4; }
  .choice.hint { animation: glow .8s ease-in-out infinite; }
  .choice.right { background: var(--ok) !important; }
  .choice.fade { opacity: .25; pointer-events: none; }
  @keyframes wob { 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }
  @keyframes glow { 50% { transform: scale(1.06) } }

  /* ---------- end ---------- */
  #end { align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #end h1 { margin: 0; font-size: 72px; line-height: 1; }
  #end .big { font-size: 72px; letter-spacing: .1em; }
  .endbtns { display: flex; gap: 22px; align-items: center; margin-top: 18px; }
  #again {
    appearance: none; border: 0; width: 128px; height: 128px; border-radius: 50%;
    background: var(--b2); color: #fff; font-size: 56px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .22);
  }
  #again:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0, 0, 0, .22); }
  #toHome { width: 64px; height: 64px; font-size: 30px; }

  @media (max-height: 640px) {
    .choice { height: 66px; font-size: 34px; }
    #word { font-size: 44px; min-height: 52px; }
    .mode { height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">

  <div class="screen on" id="home">
    <h1 aria-label="Leggo"><span>L</span><span>E</span><span>G</span><span>G</span><span>O</span><span>!</span></h1>
    <button class="mode" id="modePic" aria-label="Guarda il disegno, scegli la parola">
      <span class="e">🍎</span><span class="arrow">→</span><span>MELA</span>
    </button>
    <button class="mode" id="modeWord" aria-label="Leggi la parola, scegli il disegno">
      <span>MELA</span><span class="arrow">→</span><span class="e">🍎</span>
    </button>
  </div>

  <div class="screen" id="game">
    <div class="top">
      <button class="back" id="back" aria-label="Torna all'inizio">✕</button>
      <div class="dots" id="dots"></div>
      <div class="stars" id="stars">⭐ 0</div>
    </div>
    <div class="pic" id="pic">
      <div id="emoji" aria-hidden="true"></div>
      <div id="word" aria-live="polite"></div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="screen" id="end">
    <h1>BRAVO!</h1>
    <div class="big" id="endStars"></div>
    <div class="endbtns">
      <button class="back" id="toHome" aria-label="Cambia gioco">✕</button>
      <button id="again" aria-label="Gioca ancora">▶</button>
    </div>
  </div>
</div>

<script>
(function () {
  var WORDS = [
    ['SOLE', '☀️'], ['LUNA', '🌙'], ['CASA', '🏠'], ['CANE', '🐶'], ['MELA', '🍎'],
    ['PANE', '🍞'], ['UOVO', '🥚'], ['NASO', '👃'], ['MANO', '✋'], ['RANA', '🐸'],
    ['MARE', '🌊'], ['AUTO', '🚗'], ['NAVE', '🚢'], ['LUPO', '🐺'], ['DITO', '👆'],
    ['UVA', '🍇'], ['ROSA', '🌹'], ['NEVE', '❄️'], ['OSSO', '🦴'], ['DADO', '🎲'],
    ['PERA', '🍐'], ['MOTO', '🏍️'], ['OCA', '🦆'], ['SCI', '⛷️'],
    ['APE', '🐝'], ['SALE', '🧂'], ['TOPO', '🐭'], ['TORO', '🐂'],
    ['FOCA', '🦭'], ['FATA', '🧚'], ['VASO', '🏺'], ['VELA', '⛵'], ['MAGO', '🧙']
  ];
  var ROUND = 10;
  var COLS = ['var(--b1)', 'var(--b2)', 'var(--b3)', '#f08a00'];
  var $ = function (id) { return document.getElementById(id); };
  var screens = { home: $('home'), game: $('game'), end: $('end') };
  var dotsEl = $('dots'), starsEl = $('stars'), emojiEl = $('emoji'), wordEl = $('word'),
      choicesEl = $('choices'), picEl = $('pic'), endStars = $('endStars');

  var mode = 'pic'; // 'pic' = disegno -> parola, 'word' = parola -> disegno
  var queue, idx, stars, mistakes, locked, timer;

  function go(name) {
    for (var k in screens) screens[k].classList.toggle('on', k === name);
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function start(m) {
    if (m) mode = m;
    clearTimeout(timer);
    queue = shuffle(WORDS).slice(0, ROUND).map(function (w) { return { word: w[0], pic: w[1], star: false }; });
    idx = 0; stars = 0;
    dotsEl.innerHTML = '';
    for (var i = 0; i < ROUND; i++) {
      var d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d);
    }
    choicesEl.classList.toggle('pics', mode === 'word');
    updateStars();
    go('game');
    show();
  }

  function updateStars() { starsEl.textContent = '⭐ ' + stars; }

  function paintDots() {
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      var q = queue[i];
      dots[i].className = 'dot' + (q.done ? (q.star ? ' star' : ' done') : (i === idx ? ' now' : ''));
    }
  }

  // Distractors start with the SAME letter as the target whenever possible
  function pickChoices(target) {
    var letter = target.word[0];
    var same = shuffle(WORDS.filter(function (w) { return w[0] !== target.word && w[0][0] === letter; }));
    var rest = shuffle(WORDS.filter(function (w) { return w[0][0] !== letter; }));
    var chosen = same.slice(0, 2);
    while (chosen.length < 2) chosen.push(rest.shift());
    return shuffle([[target.word, target.pic]].concat(chosen));
  }

  function setWord(text, colored) {
    wordEl.innerHTML = '';
    wordEl.classList.toggle('pop', !!colored);
    text.split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.textContent = ch;
      if (colored) { s.style.color = COLS[i % COLS.length]; s.style.animationDelay = (i * 0.09) + 's'; }
      wordEl.appendChild(s);
    });
  }

  function show() {
    var w = queue[idx];
    mistakes = 0; locked = false;
    paintDots();
    picEl.classList.toggle('wordmode', mode === 'word');
    picEl.classList.remove('solved');
    emojiEl.classList.remove('hop');

    if (mode === 'pic') {
      emojiEl.textContent = w.pic;
      setWord('', false);
    } else {
      emojiEl.textContent = '';
      setWord(w.word, false);
    }

    choicesEl.innerHTML = '';
    pickChoices(w).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'choice'; b.type = 'button';
      b.textContent = mode === 'pic' ? c[0] : c[1];
      b.dataset.word = c[0];
      if (mode === 'word') b.setAttribute('aria-label', 'Disegno');
      b.addEventListener('click', function () { answer(b, c[0] === w.word); });
      choicesEl.appendChild(b);
    });
  }

  function answer(btn, ok) {
    if (locked) return;
    var w = queue[idx];
    if (!ok) {
      mistakes++;
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      btn.disabled = true;
      if (mistakes >= 2) {
        Array.prototype.forEach.call(choicesEl.children, function (b) {
          if (b.dataset.word === w.word) b.classList.add('hint');
        });
      }
      return;
    }
    locked = true;
    w.star = mistakes === 0;
    w.done = true;
    if (w.star) { stars++; updateStars(); }
    Array.prototype.forEach.call(choicesEl.children, function (b) {
      b.classList.remove('hint');
      if (b === btn) b.classList.add('right'); else b.classList.add('fade');
    });
    // reveal: picture hops in, word lights up in colors
    picEl.classList.add('solved');
    emojiEl.textContent = w.pic;
    void emojiEl.offsetWidth;
    emojiEl.classList.add('hop');
    setWord(w.word, true);
    paintDots();
    timer = setTimeout(next, 1900);
  }

  function next() {
    idx++;
    if (idx >= ROUND) return finish();
    show();
  }

  function finish() {
    endStars.textContent = '⭐ ' + stars;
    go('end');
  }

  $('modePic').addEventListener('click', function () { start('pic'); });
  $('modeWord').addEventListener('click', function () { start('word'); });
  $('again').addEventListener('click', function () { start(); });
  $('back').addEventListener('click', function () { clearTimeout(timer); go('home'); });
  $('toHome').addEventListener('click', function () { go('home'); });
})();
</script>
</body>
</html>
