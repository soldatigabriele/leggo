<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leggo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #cdeeff;
    --card: #ffffff;
    --ink: #1b2a4a;
    --dot: #9fc9e6;
    --dot-on: #ffb703;
    --b1: #ef476f;
    --b2: #1f9d6b;
    --b3: #6d5bf0;
    --ok: #1f9d6b;
    --font: "Fredoka", "Trebuchet MS", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14223f; --card: #213458; --ink: #f3f6ff; --dot: #3a527f; --dot-on: #ffc933;
  }
  :root[data-theme="light"] { color-scheme: light; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overflow: hidden;
  }
  #app {
    height: 100%; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: 14px 18px 22px; box-sizing: border-box;
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); transition: background .25s, transform .25s; }
  .dot.now { transform: scale(1.35); background: var(--ink); }
  .dot.star { background: var(--dot-on); }
  .dot.done { background: var(--ok); }
  .stars { font-size: 26px; font-weight: 700; white-space: nowrap; }

  .pic {
    flex: 1 1 auto; min-height: 0;
    margin: 14px 0 12px;
    background: var(--card); border-radius: 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(27, 42, 74, .12);
  }
  #emoji {
    font-size: min(46vw, 24vh, 190px); line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  #emoji.hop { animation: hop .6s ease-out; }
  @keyframes hop { 0% { transform: translateY(0) } 35% { transform: translateY(-22px) scale(1.08) } 70% { transform: translateY(0) scale(.97) } 100% { transform: none } }

  #word {
    height: 64px; margin-top: 6px; display: flex; gap: 6px; align-items: center;
    font-size: 54px; font-weight: 700; letter-spacing: .04em;
  }
  #word span { display: inline-block; animation: letter .5s ease-out both; }
  @keyframes letter { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }

  .choices { display: grid; gap: 12px; }
  .choice {
    appearance: none; border: 0; cursor: pointer;
    font-family: var(--font); font-weight: 700; color: #fff;
    font-size: 42px; letter-spacing: .14em; text-indent: .14em;
    height: 82px; border-radius: 26px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .22);
    transition: transform .1s, box-shadow .1s, opacity .3s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .22); }
  .choice:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
  .choice:nth-child(1) { background: var(--b1); }
  .choice:nth-child(2) { background: var(--b2); }
  .choice:nth-child(3) { background: var(--b3); }
  .choice.wrong { animation: wob .4s; opacity: .45; }
  .choice.hint { animation: glow .8s ease-in-out infinite; }
  .choice.right { background: var(--ok) !important; }
  .choice.fade { opacity: .25; pointer-events: none; }
  @keyframes wob { 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }
  @keyframes glow { 50% { transform: scale(1.05) } }

  #end { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  #end h1 { margin: 0; font-size: 72px; line-height: 1; }
  #end .big { font-size: 72px; letter-spacing: .1em; }
  #again {
    appearance: none; border: 0; cursor: pointer; margin-top: 18px;
    width: 128px; height: 128px; border-radius: 50%;
    background: var(--b2); color: #fff; font-size: 56px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .22);
  }
  #again:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0, 0, 0, .22); }
  #again:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  @media (max-height: 640px) { .choice { height: 66px; font-size: 34px; } #word { font-size: 44px; height: 52px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="dots" id="dots"></div>
    <div class="stars" id="stars">⭐ 0</div>
  </div>

  <div class="pic" id="pic">
    <div id="emoji" aria-hidden="true"></div>
    <div id="word" aria-live="polite"></div>
  </div>
  <div class="choices" id="choices"></div>

  <div id="end">
    <h1>BRAVO!</h1>
    <div class="big" id="endStars"></div>
    <button id="again" aria-label="Gioca ancora">▶</button>
  </div>
</div>

<script>
(function () {
  var WORDS = [
    ['SOLE', '☀️'], ['LUNA', '🌙'], ['CASA', '🏠'], ['CANE', '🐶'], ['MELA', '🍎'],
    ['PANE', '🍞'], ['UOVO', '🥚'], ['NASO', '👃'], ['MANO', '✋'], ['RANA', '🐸'],
    ['MARE', '🌊'], ['AUTO', '🚗'], ['NAVE', '🚢'], ['LUPO', '🐺'], ['DITO', '👆'],
    ['UVA', '🍇'], ['ROSA', '🌹'], ['NEVE', '❄️'], ['OSSO', '🦴'], ['DADO', '🎲'],
    ['PERA', '🍐'], ['MOTO', '🏍️'], ['OCA', '🦆'], ['SCI', '⛷️'],
    ['APE', '🐝'], ['SALE', '🧂'], ['TOPO', '🐭'], ['TORO', '🐂'],
    ['FOCA', '🦭'], ['FATA', '🧚'], ['VASO', '🏺'], ['VELA', '⛵'], ['MAGO', '🧙']
  ];
  var ROUND = 10;
  var $ = function (id) { return document.getElementById(id); };
  var dotsEl = $('dots'), starsEl = $('stars'), emojiEl = $('emoji'), wordEl = $('word'),
      choicesEl = $('choices'), picEl = $('pic'), endEl = $('end'), endStars = $('endStars');

  var queue, idx, stars, mistakes, locked, timer;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function start() {
    clearTimeout(timer);
    queue = shuffle(WORDS).slice(0, ROUND);
    idx = 0; stars = 0;
    endEl.style.display = 'none';
    picEl.style.display = 'flex';
    choicesEl.style.display = 'grid';
    dotsEl.innerHTML = '';
    for (var i = 0; i < ROUND; i++) {
      var d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d);
    }
    updateStars();
    show();
  }

  function updateStars() { starsEl.textContent = '⭐ ' + stars; }

  function updateDots(result) {
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = 'dot' + (i === idx && !result ? ' now' : '');
    }
    for (var k = 0; k < idx; k++) dots[k].className = 'dot ' + (queue[k].star ? 'star' : 'done');
    if (result && dots[idx]) dots[idx].className = 'dot ' + (queue[idx].star ? 'star' : 'done');
  }

  function pickChoices(target) {
    // Hard mode: distractors start with the SAME letter as the target whenever possible
    var letter = target[0][0];
    var same = shuffle(WORDS.filter(function (w) { return w[0] !== target[0] && w[0][0] === letter; }));
    var rest = shuffle(WORDS.filter(function (w) { return w[0][0] !== letter; }));
    var chosen = same.slice(0, 2);
    while (chosen.length < 2) chosen.push(rest.shift());
    return shuffle([target].concat(chosen));
  }

  function show() {
    var w = queue[idx];
    mistakes = 0; locked = false;
    updateDots(false);
    emojiEl.textContent = w[1];
    emojiEl.classList.remove('hop');
    wordEl.innerHTML = '';
    choicesEl.innerHTML = '';
    pickChoices(w).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'choice'; b.type = 'button'; b.textContent = c[0];
      b.addEventListener('click', function () { answer(b, c[0] === w[0]); });
      choicesEl.appendChild(b);
    });
  }

  function answer(btn, ok) {
    if (locked) return;
    var w = queue[idx];
    if (!ok) {
      mistakes++;
      btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
      btn.disabled = true;
      if (mistakes >= 2) {
        Array.prototype.forEach.call(choicesEl.children, function (b) {
          if (b.textContent === w[0]) b.classList.add('hint');
        });
      }
      return;
    }
    locked = true;
    w.star = mistakes === 0;
    if (w.star) { stars++; updateStars(); }
    Array.prototype.forEach.call(choicesEl.children, function (b) {
      b.classList.remove('hint');
      if (b === btn) b.classList.add('right'); else b.classList.add('fade');
    });
    emojiEl.classList.add('hop');
    var cols = ['var(--b1)', 'var(--b2)', 'var(--b3)', '#f08a00'];
    w[0].split('').forEach(function (ch, i) {
      var s = document.createElement('span');
      s.textContent = ch; s.style.color = cols[i % cols.length]; s.style.animationDelay = (i * 0.09) + 's';
      wordEl.appendChild(s);
    });
    updateDots(true);
    timer = setTimeout(next, 1900);
  }

  function next() {
    idx++;
    if (idx >= ROUND) return finish();
    show();
  }

  function finish() {
    picEl.style.display = 'none';
    choicesEl.style.display = 'none';
    endEl.style.display = 'flex';
    endStars.textContent = '⭐ ' + stars;
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) dots[i].className = 'dot ' + (queue[i].star ? 'star' : 'done');
  }

  $('again').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
